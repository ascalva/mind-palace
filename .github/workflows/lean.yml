name: lean

# The advisory Lean job (dn-mathematical-foundations §2.4, MF-5). It builds formal/, which runs
# every Plausible attack, and then the rest of formal/check.sh: the sorry count held to
# formal/sorry-budget, the axiom escape grepped shut, every declaration's axioms audited, and the
# cross-reference between docs/LAWS.md and the Lean statements (scripts/check_laws_xref.py, the
# mechanical half of MFF-4). ADVISORY: no ruleset requires it, so a red here blocks nothing; it
# informs. Making it required is the owner's act alone, after four consecutive green weeks, each
# qualified by at least one run that built a formal/ change (the note's §2.4 and MF-5).
#
# Path-scoped without a paths: filter, keeping ci.yml's P2 (every sha yields a verdict). The
# `changes` job runs on every PR and main push and reports whether the diff touches formal/, the
# ledger, the cross-reference script or this file; `lean` builds only then and is skipped
# otherwise. A skipped job satisfies a required check, so making it required needs no rework,
# where a workflow-level paths: filter would leave the check pending forever on every PR that does
# not touch formal/. The weekly cron and a manual dispatch always build; the cron catches drift in
# the pinned toolchain, or in Mathlib's cache for the pinned rev.
#
# Mathlib comes from its own cache (`lake exe cache get`, run by lean-action), never from GitHub's.
# The drift run needs a cold fetch to notice that cache going away, and a .lake entry per sha would
# be several GB against the repository's 10 GB of cache, which ci.yml's uv caches share. The Palace
# modules then build from source: 119 s (215 s CPU) on the owner's Mac, 2026-11-02.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC: the drift run
  workflow_dispatch:

concurrency:
  # One group per PR, newest run wins; one group per main sha, so no main run is ever cancelled
  # or displaced: the flip window counts them.
  group: lean-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      formal: ${{ steps.diff.outputs.formal }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Does the diff touch formal/ or the ledger?
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) BASE="$PR_BASE" ;;
            push) BASE="$PUSH_BEFORE" ;;
            *) BASE="" ;;
          esac
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            FORMAL=true # the cron, a dispatch, or a base this clone lacks: build
          elif git diff --quiet "$BASE" HEAD -- \
              formal docs/LAWS.md scripts/check_laws_xref.py .github/workflows/lean.yml; then
            FORMAL=false
          else
            FORMAL=true
          fi
          echo "formal=$FORMAL" >> "$GITHUB_OUTPUT"
          echo "build formal/: $FORMAL"

  lean:
    needs: changes
    if: needs.changes.outputs.formal == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1.7.0 # exact tag: elan, the toolchain, the Mathlib cache
        with:
          lake-package-directory: formal
          auto-config: "false" # check.sh builds, so the attacks and the gates run in one step
          use-mathlib-cache: "true"
          use-github-cache: "false"
      - name: L1 gate (build with attacks · sorry budget · axiom audit · ledger cross-reference)
        run: ./formal/check.sh
